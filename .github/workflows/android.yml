name: x64 Linux Android

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    name: >-
      ubuntu-24.04

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Prepare android toolchain
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -qq android-ndk-r26c-linux.zip

      - name: Print clang version
        run: |
          export PATH="/home/runner/work/milkywayathome_client/milkywayathome_client/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          aarch64-linux-android34-clang -v

      - name: Prepare boinc libraries
        run: |
          export PATH="/home/runner/work/milkywayathome_client/milkywayathome_client/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android34-clang
          export CXX=aarch64-linux-android34-clang++
          mkdir boinc_build
          cd ./boinc_build
          git clone --depth 1 https://github.com/BOINC/boinc.git
          cd ./boinc
          ./_autosetup
          ./configure --host=aarch64-linux --with-boinc-platform="aarch64-android-linux-gnu" --with-boinc-alt-platform="arm-android-linux-gnu" --disable-server --disable-manager --disable-client --enable-static CXXFLAGS="-O3 "
          make -j

      - name: Run make
        run: |
          export PATH="/home/runner/work/milkywayathome_client/milkywayathome_client/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android34-clang
          export CXX=aarch64-linux-android34-clang++
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DNBODY_DEV_OPTIONS=ON -DNBODY_GL=OFF -DNBODY_STATIC=ON -DENABLE_CURSES=OFF -DSEPARATION_OPENCL=OFF -DBOINC_APPLICATION=ON -DNBODY_CRLIBM=ON -DSEPARATION=OFF -DDOUBLEPREC=ON -DNBODY_OPENMP=ON -DNBODY_OPENCL=OFF -DAUTODIFF=OFF -DAUTODIFF_LOG=OFF ..
          make -j

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nbody
          retention-days: 1
          path: |
            ./build/bin/milkyway_nbody
